<!DOCTYPE html>
<!-- Define que o documento é HTML5 -->
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres (acentos) -->
    <meta charset="UTF-8">
    <!-- Título que aparece na aba do navegador -->
    <title>Cadastro de Alunos</title>
    <!-- Liga o arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Caixa central que agrupa todo o conteúdo -->
    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <!-- Formulário com os campos nome e idade -->
        <!-- Formulário de cadastro: agora com 4 campos -->
<form id="formAluno">
    <input type="text" id="nome" placeholder="Nome do aluno" required>
    <input type="number" id="idade" placeholder="Idade" required>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="text" id="curso" placeholder="Curso" required>

    <button type="submit">Cadastrar</button>
</form>

        <h2>Alunos cadastrados</h2>

        <!-- Lista onde o JavaScript vai mostrar os alunos -->
        <ul id="listaAlunos"></ul>
    </div>

    <!-- Liga o arquivo JavaScript (fica no final para o HTML carregar primeiro) -->
    <script src="script.js"></script>
</body>
</html>
